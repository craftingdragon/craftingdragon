# Docker DNS keeps the upstream addresses current after container replacement.
resolver 127.0.0.11 valid=30s ipv6=off;

upstream readme_stats {
    zone readme_stats 64k;
    server github-readme-stats:9000 resolve;
}

upstream streak_stats {
    zone streak_stats 64k;
    server github-readme-streak-stats:9000 resolve;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /streak {
        return 308 /streak/$is_args$args;
    }

    location = /streak/ {
        if ($arg_type = png) { return 400 "This deployment supports SVG cards only.\n"; }
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/src/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass streak_stats;
    }

    location /streak/ { return 404; }

    location / {
        proxy_pass http://readme_stats;
    }
}
